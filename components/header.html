<!-- ==========================================================================
     HEADER ACTIONS & MOBILE DRAWER NAVIGATION (COMPONENTS/HEADER.HTML)
     ========================================================================== -->
<div class="header-actions">
  <!-- Currency Selector -->
  <div class="currency-selector">
    <select id="currencySelect" title="Select Currency">
      <option value="VND" selected>🇻🇳 VND</option>
      <option value="USD">🇺🇸 USD</option>
      <option value="EUR">🇪🇺 EUR</option>
    </select>
  </div>

  <div class="header-actions-divider"></div>

  <!-- Wishlist Icon ♡ -->
  <button class="btn-icon-action" id="btnOpenWishlist" title="Saved Wishlist">
    <i class="fa-regular fa-heart"></i>
    <span class="badge-count-sm" id="wishlistCount" style="display: none;">0</span>
  </button>

  <!-- Cart Icon 🛒 -->
  <button class="btn-icon-action" id="btnOpenCart" title="Booking Cart">
    <i class="fa-solid fa-bag-shopping"></i>
    <span class="badge-count-sm" id="cartCount" style="display: none;">0</span>
  </button>

  <div class="header-actions-divider"></div>

  <!-- My Trips Link -->
  <button class="nav-action-link" id="btnOpenTrips"><i class="fa-solid fa-suitcase"></i> Trips (<span id="tripsHeaderCount">0</span>)</button>

  <!-- VIP Callback Button -->
  <button class="btn-vip-callback" id="btnOpenContactModal"><i class="fa-solid fa-headset"></i> Tư Vấn VIP</button>

  <!-- Member Sign In / User Profile Button -->
  <div class="user-account-wrapper" style="position: relative; display: inline-block;">
    <button class="btn-signin-pill" id="btnSignIn"><i class="fa-brands fa-google"></i> Sign in</button>
  </div>

  <!-- Mobile Menu Hamburger Button -->
  <button class="mobile-toggle" id="mobileMenuBtn" aria-label="Toggle Navigation">
    <i class="fa-solid fa-bars"></i>
  </button>
</div>
